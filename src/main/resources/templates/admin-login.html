<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 | 나의 개발 블로그</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<header class="site-header">
    <div class="container navigation">
        <a class="brand" href="/">나의 개발 블로그</a>
        <nav aria-label="주 메뉴"><a href="/">블로그 홈</a></nav>
    </div>
</header>

<main class="container page-center">
    <section class="panel login-panel" aria-labelledby="login-heading">
        <p class="eyebrow">ADMIN LOGIN</p>
        <h1 id="login-heading">관리자 로그인</h1>
        <p class="muted">관리자 계정으로 로그인한 뒤 블로그를 관리하세요.</p>

        <!-- 로그인 실패 때 Controller가 전달한 errorMessage가 있을 때만 출력합니다. -->
        <p class="form-error" th:if="${errorMessage}" th:text="${errorMessage}">
            아이디 또는 비밀번호가 틀렸습니다.
        </p>

        <!-- 입력한 adminId, password를 POST /admin/login Controller로 전송합니다. -->
        <form th:action="@{/admin/login}" method="post">
            <label for="admin-id">아이디</label>
            <input id="admin-id" name="adminId" type="text" placeholder="아이디를 입력하세요" required autofocus>

            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" required>

            <button type="submit">로그인</button>
        </form>

        <p class="muted">실습용 계정: admin / 1234</p>
        <a class="text-link" href="/">← 블로그 홈으로 돌아가기</a>
    </section>
</main>
</body>
</html>
