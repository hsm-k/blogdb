<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 | 나의 개발 블로그</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<header class="site-header">
    <div class="container navigation">
        <a class="brand" href="/">나의 개발 블로그</a>
        <nav aria-label="주 메뉴">
            <a href="/">블로그 홈</a>
            <!-- POST /admin/logout 요청을 보내 현재 세션을 삭제합니다. -->
            <form th:action="@{/admin/logout}" method="post" class="logout-form">
                <button type="submit" class="logout-button">로그아웃</button>
            </form>
        </nav>
    </div>
</header>

<main class="container page-center">
    <section class="panel admin-panel" aria-labelledby="admin-heading">
        <p class="eyebrow">BLOG MANAGEMENT</p>
        <!-- Controller가 Model에 담은 admin 객체에서 관리자 이름을 출력합니다. -->
        <h1 id="admin-heading"><span th:text="${admin.adminName}">관리자</span>님, 환영합니다.</h1>
        <p class="muted">
            로그인 아이디: <strong th:text="${admin.adminId}">admin</strong>
        </p>

        <div class="management-menu">
            <div>
                <h2>블로그 관리</h2>
                <p>게시글과 블로그 정보를 관리할 기능을 이곳에 추가할 수 있습니다.</p>
            </div>
            <div class="action-row" style="display: flex; gap: 10px; flex-wrap: wrap;">
                <a class="button" href="/admin/projects">게임 프로젝트 관리</a>
                <a class="button" href="/admin/posts">게시글 관리</a>
                <a class="button" href="/content/write">콘텐츠 저장</a>
            </div>
        </div>

        <form th:action="@{/admin/logout}" method="post">
            <button type="submit">로그아웃</button>
        </form>
    </section>
</main>
</body>
</html>
