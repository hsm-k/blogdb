<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>게시글 수정</title><link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"></head>
<body><header class="site-header"><div class="container navigation"><a class="brand" href="/">나의 블로그</a><nav><a href="/admin/posts">게시글 관리</a></nav></div></header>
<main class="container page-center"><section class="panel post-form-panel"><p class="eyebrow">EDIT POST</p><h1>게시글 수정</h1><p class="form-intro">기존 콘텐츠를 텍스트 또는 이미지로 바꿀 수 있습니다.</p><form th:action="@{/admin/posts/{id}/edit(id=${post.id})}" method="post" enctype="multipart/form-data"><label for="title">제목</label><input id="title" name="title" th:value="${post.title}" required><label for="category">카테고리</label><input id="category" name="category" th:value="${post.category}" required><fieldset class="content-type-picker"><legend>콘텐츠 종류</legend><label class="content-type-card" for="textType"><input id="textType" type="radio" name="contentType" value="TEXT" th:checked="${post.contentType == null or post.contentType == 'TEXT'}"><span class="content-type-icon">T</span><span><strong>텍스트</strong><small>게임 후기, 공략, 개발 기록을 작성합니다.</small></span></label><label class="content-type-card" for="imageType"><input id="imageType" type="radio" name="contentType" value="IMAGE" th:checked="${post.contentType == 'IMAGE'}"><span class="content-type-icon">▧</span><span><strong>이미지</strong><small>새 파일이나 이미지 URL로 교체합니다.</small></span></label></fieldset><section id="textContentSection" class="content-editor"><label for="content">텍스트 내용</label><textarea id="content" name="content" th:text="${post.contentType == null or post.contentType == 'TEXT' ? post.content : ''}" placeholder="게임 플레이 경험이나 개발 내용을 작성하세요."></textarea></section><section id="imageContentSection" class="content-editor" hidden><div class="editor-heading"><label for="imageFile">새 이미지 파일</label><span>최대 10MB</span></div><label class="file-drop-zone" for="imageFile"><span class="upload-symbol">↑</span><strong>이미지 파일 선택</strong><small>파일을 선택하면 기존 이미지를 교체합니다.</small><input id="imageFile" name="imageFile" type="file" accept="image/*"></label><p class="or-text">또는</p><label for="imageUrl">새 이미지 URL</label><input id="imageUrl" name="imageUrl" type="url" th:value="${post.contentType == 'IMAGE' ? post.content : ''}" placeholder="https://example.com/image.jpg"><img id="imagePreview" class="image-preview" alt="선택한 이미지 미리보기" hidden></section><button type="submit">수정 내용 저장</button></form><a class="text-link" th:href="@{/admin/posts/{id}(id=${post.id})}">← 상세 화면으로 돌아가기</a></section></main><script src="/js/post-content-form.js"></script></body></html>
