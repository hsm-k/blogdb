<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 게임 프로젝트 등록 - PLAYLOG 관리자</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<header class="site-header">
    <div class="container navigation">
        <a class="brand" href="/">PLAYLOG</a>
        <nav><a href="/admin/projects">프로젝트 관리</a></nav>
    </div>
</header>

<main class="container page-center">
    <section class="panel post-form-panel" style="width: min(100%, 720px);">
        <p class="eyebrow">NEW GAME PROJECT</p>
        <h1>새 게임 프로젝트 등록</h1>
        <p class="form-intro">게임 기획 내용과 개발 진행 상황, 외부 연동 링크(GitHub, WebGL)를 입력합니다.</p>

        <form th:action="@{/admin/projects/create}" method="post">
            <label for="title">프로젝트 이름</label>
            <input id="title" name="title" placeholder="예: 마블 벤치 (Marble Bench)" required>

            <label for="genre">게임 장르</label>
            <input id="genre" name="genre" placeholder="예: 3D 물리 액션 어드벤처" required>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div>
                    <label for="status">개발 상태</label>
                    <select id="status" name="status" style="width: 100%; margin-bottom: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit;">
                        <option value="기획 중">기획 중</option>
                        <option value="개발 중" selected>개발 중</option>
                        <option value="테스트 중">테스트 중</option>
                        <option value="출시 완료">출시 완료</option>
                    </select>
                </div>
                <div>
                    <label for="progress">개발 진행률 (%)</label>
                    <input id="progress" name="progress" type="number" min="0" max="100" value="0" placeholder="0 ~ 100">
                </div>
            </div>

            <label for="summary">게임 개요 및 기획 의도</label>
            <textarea id="summary" name="summary" rows="5" placeholder="게임의 조작 방식, 주요 재미 요소, 적용 기술 등을 작성하세요." style="width: 100%; margin-bottom: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit;"></textarea>

            <label for="githubUrl">GitHub 저장소 주소 (선택)</label>
            <input id="githubUrl" name="githubUrl" type="url" placeholder="https://github.com/사용자/저장소명">

            <label for="playUrl">Unity WebGL 플레이 주소 (선택)</label>
            <input id="playUrl" name="playUrl" type="url" placeholder="https://play.unity.com/ko/games/... 또는 WebGL 실행 URL">

            <button type="submit" style="margin-top: 18px;">프로젝트 저장</button>
        </form>

        <div style="margin-top: 20px;">
            <a class="text-link" href="/admin/projects">← 목록으로 돌아가기</a>
        </div>
    </section>
</main>
</body>
</html>
