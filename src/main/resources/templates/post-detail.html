<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title} + ' - PLAYLOG'">게시글 상세</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<header class="site-header">
    <div class="container navigation">
        <a class="brand" href="/">PLAYLOG</a>
        <nav aria-label="주 메뉴">
            <a href="/">홈</a>
            <a href="/projects">게임 프로젝트</a>
            <a href="/posts">개발일지</a>
            <a href="/admin/login">관리자 로그인</a>
        </nav>
    </div>
</header>

<main class="container page-center">
    <article class="panel post-detail">
        <p class="category-badge" th:text="${post.category}">카테고리</p>
        <h1 th:text="${post.title}">제목</h1>
        <p class="post-date" th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')} + ' 작성'">작성일</p>

        <!-- 기본 게시글 본문 (텍스트 또는 메인 이미지) -->
        <p class="post-content" th:if="${post.contentType == null or post.contentType == 'TEXT'}" th:text="${post.content}">내용</p>
        <img class="post-image" th:if="${post.contentType == 'IMAGE' and post.imageDataPresent}" th:src="@{/content/image/{id}(id=${post.id})}" th:alt="${post.title} + ' 이미지'">
        <img class="post-image" th:if="${post.contentType == 'IMAGE' and !post.imageDataPresent and post.content != null}" th:src="${post.content}" th:alt="${post.title} + ' 이미지'">

        <!-- [단계 B] 본문 콘텐츠 모듈 (텍스트·이미지 블록 정해진 순서대로 출력) -->
        <section class="content-module-section" th:if="${contentModules != null and !contentModules.isEmpty()}">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">CONTENT</p>
                    <h2>상세 내용</h2>
                </div>
            </div>
            <div class="module-list">
                <div class="module-item" th:each="module : ${contentModules}">
                    <!-- 텍스트 블록 -->
                    <p class="post-content" th:if="${module.type.name() == 'TEXT'}" th:text="${module.text}">텍스트 블록</p>
                    <!-- 이미지 블록 -->
                    <img class="post-image" th:if="${module.type.name() == 'IMAGE'}" th:src="${module.location}" alt="본문 이미지 블록">
                </div>
            </div>
        </section>

        <!-- [단계 C] 댓글 기능 (댓글 목록 및 댓글 작성) -->
        <section class="comment-section">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">COMMENTS</p>
                    <h2 th:text="'댓글 (' + ${comments != null ? comments.size() : 0} + ')'">댓글 (0)</h2>
                </div>
            </div>

            <!-- 공백 댓글 등 에러 메시지 안내 (예외 상황 처리) -->
            <div class="form-error" th:if="${errorMessage != null}" th:text="${errorMessage}">
                오류 메시지
            </div>

            <!-- 댓글 작성 폼 -->
            <form class="comment-form" th:action="@{/posts/{id}/comments(id=${post.id})}" method="post">
                <div class="form-row">
                    <label for="commentAuthor">작성자</label>
                    <input id="commentAuthor" name="author" type="text" placeholder="작성자 이름 (생략 시 방문자)">
                </div>
                <div class="form-row">
                    <label for="commentContent">내용</label>
                    <textarea id="commentContent" name="content" placeholder="댓글을 입력하세요." required></textarea>
                </div>
                <button type="submit">댓글 등록</button>
            </form>

            <!-- 댓글 목록 (현재 게시글에 저장된 댓글만 순서대로 표시) -->
            <div class="comment-list" th:if="${comments != null and !comments.isEmpty()}">
                <div class="comment-item" th:each="comment : ${comments}">
                    <div class="comment-header">
                        <strong class="comment-author" th:text="${comment.author}">작성자</strong>
                        <span class="comment-date" th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</span>
                    </div>
                    <p class="comment-content" th:text="${comment.content}">댓글 내용</p>
                </div>
            </div>
            <p class="empty-message" th:if="${comments == null or comments.isEmpty()}">
                아직 작성된 댓글이 없습니다. 첫 댓글을 남겨보세요!
            </p>
        </section>

        <div class="action-row" style="margin-top: 24px;">
            <a class="text-link" href="/posts">← 게시글 목록으로 돌아가기</a>
        </div>
    </article>
</main>

<footer class="site-footer">
    <div class="container">© 2026 나의 블로그</div>
</footer>
</body>
</html>
