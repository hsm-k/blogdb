<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 프로젝트 - PLAYLOG</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <style>
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }
        .project-card {
            background: #fff;
            border: 1px solid var(--line, #e2e8f0);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.06);
        }
        .status-badge {
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: #e0f2fe;
            color: #0369a1;
        }
        .progress-wrapper {
            margin: 14px 0;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted, #64748b);
            margin-bottom: 6px;
        }
        .progress-bar-bg {
            background: #f1f5f9;
            border-radius: 8px;
            height: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #3b82f6, #6366f1);
            height: 100%;
            border-radius: 8px;
            transition: width 0.3s;
        }
        .project-links {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .btn-sm {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-primary { background: var(--blue, #2563eb); color: #fff; }
        .btn-outline { border: 1px solid var(--line, #cbd5e1); color: var(--navy, #1e293b); }
    </style>
</head>
<body>
<header class="site-header">
    <div class="container navigation">
        <a class="brand" href="/">PLAYLOG</a>
        <nav aria-label="주 메뉴">
            <a href="/">홈</a>
            <a href="/projects">게임 프로젝트</a>
            <a href="/posts">개발일지</a>
            <a href="/admin" th:if="${session.loginAdmin != null}">관리자 홈</a>
            <a href="/admin/login" th:if="${session.loginAdmin == null}">관리자 로그인</a>
        </nav>
    </div>
</header>

<main class="container page-center">
    <div class="panel" style="width: min(100%, 860px);">
        <div class="section-heading">
            <div>
                <p class="eyebrow">GAME PROJECTS</p>
                <h1>게임 프로젝트 목록</h1>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <span th:text="'총 ' + ${projects != null ? projects.size() : 0} + '개의 프로젝트'">총 0개의 프로젝트</span>
                <a class="button" th:if="${session.loginAdmin != null}" href="/admin/projects/create" style="padding: 6px 14px; font-size: 0.85rem;">+ 새 프로젝트 등록</a>
            </div>
        </div>
        <p class="form-intro" style="margin-top: 8px;">
            기획부터 완성까지 직접 제작 중인 게임 프로젝트의 개발 현황과 실행 빌드를 확인하세요.
        </p>

        <!-- 프로젝트 목록 카드 -->
        <div class="project-grid" th:if="${projects != null and !projects.isEmpty()}">
            <article class="project-card" th:each="project : ${projects}">
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span class="category-badge" th:text="${project.genre}">장르</span>
                        <span class="status-badge" th:text="${project.status}">개발 중</span>
                    </div>

                    <h2 style="font-size: 1.3rem; margin: 12px 0 8px;">
                        <a th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.title}">게임 프로젝트 제목</a>
                    </h2>

                    <p style="color: var(--muted); font-size: 0.92rem; line-height: 1.5; margin: 0;"
                       th:text="${project.summary}">프로젝트 요약 설명</p>
                </div>

                <div>
                    <!-- 진행률 바 -->
                    <div class="progress-wrapper">
                        <div class="progress-header">
                            <span>개발 진행도</span>
                            <span th:text="${project.progress} + '%'">0%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" th:style="'width: ' + ${project.progress} + '%;'"></div>
                        </div>
                    </div>

                    <div class="project-links">
                        <a class="btn-sm btn-outline" th:href="@{/projects/{id}(id=${project.id})}">상세 보기 →</a>
                        <a class="btn-sm btn-primary" th:if="${project.hasPlayUrl()}" th:href="${project.playUrl}" target="_blank">🎮 웹 플레이</a>
                        <a class="btn-sm btn-outline" th:if="${session.loginAdmin != null}" th:href="@{/admin/projects/{id}/edit(id=${project.id})}" style="margin-left: auto;">⚙️ 수정</a>
                    </div>
                </div>
            </article>
        </div>

        <p class="empty-message" style="margin-top: 24px;" th:if="${projects == null or projects.isEmpty()}">
            아직 등록된 게임 프로젝트가 없습니다. 관리자 화면에서 프로젝트를 등록해 보세요!
        </p>

        <div style="margin-top: 28px;">
            <a class="text-link" href="/">← 홈으로 돌아가기</a>
        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="container">© 2026 PLAYLOG · 게임 개발 블로그</div>
</footer>
</body>
</html>
