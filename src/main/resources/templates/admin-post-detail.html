<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>게시글 상세</title><link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"></head>
<body><header class="site-header"><div class="container navigation"><a class="brand" href="/">나의 블로그</a><nav><a href="/admin/posts">게시글 관리</a></nav></div></header>
<main class="container page-center"><article class="panel post-detail"><p class="eyebrow" th:text="${post.category}">카테고리</p><h1 th:text="${post.title}">제목</h1><p class="post-date" th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')} + ' 작성'">작성일</p><p class="post-content" th:if="${post.contentType == null or post.contentType == 'TEXT'}" th:text="${post.content}">내용</p><img class="post-image" th:if="${post.contentType == 'IMAGE' and post.imageDataPresent}" th:src="@{/content/image/{id}(id=${post.id})}" th:alt="${post.title} + ' 이미지'"><img class="post-image" th:if="${post.contentType == 'IMAGE' and !post.imageDataPresent}" th:src="${post.content}" th:alt="${post.title} + ' 이미지'"><section class="content-module-section"><div class="section-heading"><div><p class="eyebrow">CONTENT MODULE</p><h2>본문 콘텐츠</h2></div></div><div class="module-list" th:if="${!contentModules.isEmpty()}"><div class="module-item" th:each="module, stat : ${contentModules}"><div class="module-item-header"><p class="module-order" th:text="${module.displayOrder} + '번 블록'">1번 블록</p><div class="module-order-actions"><form th:if="${!stat.first}" th:action="@{/admin/posts/{id}/contents/{moduleId}/up(id=${post.id}, moduleId=${module.id})}" method="post"><button class="order-button" type="submit">위로</button></form><form th:if="${!stat.last}" th:action="@{/admin/posts/{id}/contents/{moduleId}/down(id=${post.id}, moduleId=${module.id})}" method="post"><button class="order-button" type="submit">아래로</button></form></div></div><p class="post-content" th:if="${module.type.name() == 'TEXT'}" th:text="${module.text}">텍스트</p><img class="post-image" th:if="${module.type.name() == 'IMAGE'}" th:src="${module.location}" alt="본문 이미지"></div></div><p class="empty-message" th:if="${contentModules.isEmpty()}">아직 추가한 콘텐츠 모듈이 없습니다.</p><div class="content-form-grid module-form-grid"><form class="module-form" th:action="@{/admin/posts/{id}/contents/text(id=${post.id})}" method="post"><label for="moduleText">텍스트 모듈</label><textarea id="moduleText" name="text" placeholder="본문에 추가할 문장을 입력하세요." required></textarea><button type="submit">텍스트 추가</button></form><form class="module-form" th:action="@{/admin/posts/{id}/contents/image(id=${post.id})}" method="post" enctype="multipart/form-data"><label for="moduleFile">이미지 모듈</label><input id="moduleFile" name="file" type="file" accept="image/*" required><button type="submit">이미지 추가</button></form></div></section><section class="comment-section"><div class="section-heading"><div><p class="eyebrow">COMMENTS</p><h2 th:text="'댓글 (' + ${comments != null ? comments.size() : 0} + ')'">댓글 (0)</h2></div></div><div class="comment-list" th:if="${comments != null and !comments.isEmpty()}"><div class="comment-item" th:each="comment : ${comments}"><div class="comment-header"><strong class="comment-author" th:text="${comment.author}">작성자</strong><span class="comment-date" th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</span></div><p class="comment-content" th:text="${comment.content}">댓글 내용</p></div></div><p class="empty-message" th:if="${comments == null or comments.isEmpty()}">등록된 댓글이 없습니다.</p></section><div class="action-row"><a class="button" th:href="@{/admin/posts/{id}/edit(id=${post.id})}">수정</a><form th:action="@{/admin/posts/{id}/delete(id=${post.id})}" method="post"><button class="danger-button" type="submit">삭제</button></form></div><a class="text-link" href="/admin/posts">← 목록으로 돌아가기</a></article></main></body></html>
