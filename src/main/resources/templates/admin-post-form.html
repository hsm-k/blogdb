<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<header class="site-header">
    <div class="container navigation">
        <a class="brand" href="/">나의 블로그</a>
        <nav><a href="/admin/posts">게시글 관리</a></nav>
    </div>
</header>

<main class="container page-center">
    <section class="panel post-form-panel" style="width: min(100%, 760px);">
        <p class="eyebrow">NEW POST</p>
        <h1>새 게시글 작성</h1>
        <p class="form-intro">제목과 카테고리를 입력한 뒤, 아래 버튼으로 본문 블록을 자유롭게 추가하세요.</p>

        <form id="postForm" th:action="@{/admin/posts/create}" method="post" enctype="multipart/form-data">

            <!-- 기본 정보 -->
            <label for="title">제목</label>
            <input id="title" name="title" required>

            <label for="category">카테고리</label>
            <input id="category" name="category" placeholder="예: Spring Boot" required>

            <!-- 메인 콘텐츠 (기존 호환) -->
            <fieldset class="content-type-picker">
                <legend>메인 콘텐츠 종류</legend>
                <label class="content-type-card" for="textType">
                    <input id="textType" type="radio" name="contentType" value="TEXT" checked>
                    <span class="content-type-icon">T</span>
                    <span><strong>텍스트</strong><small>게임 후기, 공략, 개발 기록을 작성합니다.</small></span>
                </label>
                <label class="content-type-card" for="imageType">
                    <input id="imageType" type="radio" name="contentType" value="IMAGE">
                    <span class="content-type-icon">▧</span>
                    <span><strong>이미지</strong><small>내 컴퓨터의 이미지 또는 이미지 URL을 등록합니다.</small></span>
                </label>
            </fieldset>

            <section id="textContentSection" class="content-editor">
                <label for="content">텍스트 내용</label>
                <textarea id="content" name="content" placeholder="게임 플레이 경험이나 개발 내용을 작성하세요."></textarea>
            </section>

            <section id="imageContentSection" class="content-editor" hidden>
                <div class="editor-heading">
                    <label for="imageFile">이미지 파일</label>
                    <span>최대 10MB</span>
                </div>
                <label class="file-drop-zone" for="imageFile">
                    <span class="upload-symbol">↑</span>
                    <strong>이미지 파일 선택</strong>
                    <small>JPG, PNG, GIF 등 이미지 파일을 선택하세요.</small>
                    <input id="imageFile" name="imageFile" type="file" accept="image/*">
                </label>
                <p class="or-text">또는</p>
                <label for="imageUrl">이미지 URL</label>
                <input id="imageUrl" name="imageUrl" type="url" placeholder="https://example.com/image.jpg">
                <img id="imagePreview" class="image-preview" alt="선택한 이미지 미리보기" hidden>
            </section>

            <!-- ===== 동적 콘텐츠 블록 영역 ===== -->
            <section class="dynamic-modules-section">
                <div class="section-heading" style="margin-top: 28px;">
                    <div>
                        <p class="eyebrow">CONTENT BLOCKS</p>
                        <h2>본문 블록 추가</h2>
                    </div>
                </div>
                <p style="color: var(--muted); font-size: .9rem; margin-bottom: 16px;">
                    아래 버튼을 눌러 텍스트나 이미지 블록을 원하는 만큼 추가하세요. 순서대로 본문에 표시됩니다.
                </p>

                <!-- 추가 버튼 -->
                <div class="module-add-buttons">
                    <button type="button" id="addTextBlock" class="module-add-btn">
                        <span class="module-add-icon">T</span> 텍스트 블록 추가
                    </button>
                    <button type="button" id="addImageBlock" class="module-add-btn">
                        <span class="module-add-icon">🖼</span> 이미지 블록 추가
                    </button>
                </div>

                <!-- 동적으로 추가되는 블록들이 여기에 들어감 -->
                <div id="moduleContainer"></div>
            </section>

            <button type="submit" style="margin-top: 24px;">게시글 등록</button>
        </form>

        <a class="text-link" href="/admin/posts">← 목록으로 돌아가기</a>
    </section>
</main>
<script th:src="@{/js/dynamic-modules.js}"></script>
<script th:src="@{/js/post-content-form.js}"></script>
</body>
</html>
