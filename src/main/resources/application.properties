spring.application.name=blogdb

spring.datasource.url=jdbc:mariadb://localhost:3000/blogdb?allowPublicKeyRetrieval=true

spring.datasource.username=blogmng
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
# 게시글 대표 이미지와 본문 이미지 업로드 허용 크기
spring.servlet.multipart.max-file-size=50MB
# 한 게시글에 여러 이미지를 첨부할 수 있으므로 전체 요청 크기는 더 크게 설정
spring.servlet.multipart.max-request-size=100MB
content.upload-dir=uploads/content
